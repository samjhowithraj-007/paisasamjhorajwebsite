# Publishes this site to GitHub Pages (www.paisasamjhoraj.com) on every push to main. README-only changes skip it.
name: Publish website
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # queue runs; cancelling a running Pages deploy can leave it half-finished

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: mkdir site && cp -r index.html favicon.ico cart.js books.js CNAME manifest.webmanifest sw.js robots.txt sitemap.xml site-index.json googleef50f6b23d7dfe9f.html design.css base.css app.js hi.html hinglish.html terms.html refund.html shipping.html contact.html privacy.html about.html sip-calculator.html emi-calculator.html sip-kaise-shuru-kare.html emergency-fund-kitna-hona-chahiye.html family-budget-planner.html img books art site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - name: Let the new artifact register
        run: sleep 15
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before one retry
        if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
